<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: #333333;
        margin: 20px;
        text-align: center;
    }
    .check {
        font-size: 48px;
        color: #16a34a;
        margin-bottom: 12px;
    }
    h1 {
        font-size: 20px;
        color: #0f172a;
        margin-bottom: 8px;
    }
    p {
        color: #64748b;
        max-width: 450px;
        margin: 0 auto 16px auto;
    }
    .box {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 12px 16px;
        color: #15803d;
        font-weight: 500;
        display: inline-block;
        margin-top: 10px;
    }
</style>
</head>
<body>
    <div class="check">✓</div>
    <h1>Installation Complete</h1>
    <p>The DLP Agent has been installed successfully as a background system LaunchDaemon.</p>
    <div class="box">
        The Agent Activation Window will now open to configure your Server URL & Login.
    </div>
</body>
</html>
