[package]
name = "mac-dlp-agent"
version = "1.0.0"
edition = "2021"
description = "DLP Agent for macOS — converted from Windows/Linux agent"
authors = ["DLP Team"]

[[bin]]
name = "dlp-agent"
path = "src/main.rs"

[lib]
name = "dlp_agent_mac"
path = "src/lib.rs"

# ── Cross-platform dependencies (same as Linux agent) ─────────────────────────
[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Web / HTTP
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
hyper = { version = "0.14", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "0.2"
bytes = "1.4"
warp = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
url = "2.5"
form_urlencoded = "1.2"

# TLS
rustls = "0.21"
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
webpki-roots = "0.22"
webpki = "0.22"
rcgen = "0.11"
pem = "2.0"
hyper-rustls = "0.24"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1.21"
lazy_static = "1.5"
time = "0.3"
thiserror = "1.0"
rand = "0.8"
parking_lot = "0.12"
walkdir = "2.5"
tempfile = "3"
base64 = "0.22"
notify = "8.2"
regex = "1.12"
sysinfo = "0.37"
socket2 = "0.6"
network-interface = "2.0"
dashmap = "6.1"
whoami = "1.4"
infer = "0.13"
mac_address = "1.1"
local_ipaddress = "0.1"
whatlang = "0.16"
unicode-segmentation = "1.10"
fallible = "0.1"
ring = "0.17"
tract-onnx = "0.21"

# Image / OCR
image = "0.25"
imageproc = "0.25"

# ── macOS-specific dependencies ───────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
# Apple Security Framework (Keychain, TLS, code signing)
security-framework = "2"
security-framework-sys = "2"

# Core Foundation (CF types bridging)
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Objective-C 2 bridge (NSWorkspace, NSPasteboard, Vision, etc.)
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
# objc2-vision = "0.2"   # Enable when Vision OCR is ready

# Core Graphics (screen capture: CGDisplayCreateImage)
core-graphics = "0.23"
core-graphics-types = "0.1"

# Grand Central Dispatch (macOS threading)
dispatch = "0.2"

# Block support (Objective-C blocks)
block2 = "0.5"

# CUPS (print job monitoring)
# cups-sys = "0.1"    # Uncomment when print monitor is implemented

# libc for POSIX / macOS syscalls
libc = "0.2"

[build-dependencies]
# Build script for entitlements / codesign
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
