<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Restricted - DLP Security</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            color: #f87171;
            margin: 0 0 12px 0;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        .url-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
            word-break: break-all;
            margin-bottom: 24px;
            border: 1px dashed #475569;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛡️</div>
        <h1>Website Blocked by DLP Policy</h1>
        <p>Your organization's Data Loss Prevention security policy prevents access to this website.</p>
        <div class="url-box" id="target-url">Loading...</div>
        <button onclick="window.close()">Close Tab</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url") || window.location.href;
        document.getElementById("target-url").textContent = url;
    </script>
</body>
</html>
